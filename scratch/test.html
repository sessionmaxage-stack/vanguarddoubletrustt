<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OTP Confirm Automated Test</title>
</head>
<body style="padding: 20px; font-family: sans-serif;">
  <h2>Automated Test: OTP Confirm Flow</h2>
  <div id="results" style="font-family: monospace; font-size: 14px; background: #0f172a; color: #f8fafc; padding: 20px; border-radius: 8px; white-space: pre-wrap; min-height: 400px;">Running test...</div>

  <script>
    const resEl = document.getElementById("results");
    function report(line) {
      console.log(line);
      resEl.textContent += "\n" + line;
      try {
        fetch("/log", { method: "POST", body: String(line) }).catch(() => {});
      } catch (_) {}
    }

    // Mock API
    window.fetch = async (url, opts) => {
      if (!url.includes("/log")) report("[FETCH] " + url);
      if (url.includes("/api/customer/transfer/request-otp")) {
        return {
          ok: true,
          json: async () => ({
            ok: true,
            maskedEmail: "test@vanguardtest.com",
            emailDelivered: true,
            emailSent: true
          })
        };
      }
      return { ok: true, json: async () => ({ ok: true }) };
    };

    function escapeHtml(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function integrityHash(fields) {
      const str = Array.isArray(fields)
        ? fields.map(function (v) { return String(v == null ? "" : v); }).join("|||")
        : String(fields == null ? "" : fields);
      let h1 = 0x811c9dc5, h2 = 0xdeadbeef;
      for (let i = 0; i < str.length; i++) {
        const c = str.charCodeAt(i) & 0xff;
        h1 = Math.imul(h1 ^ c, 0x01000193);
        h2 = Math.imul(h2 ^ c, 0x85ebca77);
      }
      h1 = (h1 ^ (h1 >>> 16)) >>> 0;
      h2 = (h2 ^ (h2 >>> 13)) >>> 0;
      return ("00000000" + h1.toString(16)).slice(-8) + ("00000000" + h2.toString(16)).slice(-8);
    }

    function sealTransferContext(ctx) { return ctx; }
  </script>

  <!-- Include showCombinedPinAndOtpDialog directly from customer/assets/js/auth-session.js logic -->
  <script>
    const showCombinedPinAndOtpDialog = async (transferContext) => {
      const context = transferContext || {};
      const toAccountNumber = String(context.toAccountNumber || "").trim();
      const toEmail = String(context.toEmail || "").trim().toLowerCase();
      const amount = Number(context.amount);
      const currency = String(context.currency || "USD").trim().toUpperCase() || "USD";
      const memo = String(context.memo || "").trim();
      const toFullName = String(context.toFullName || "").trim() || "John Doe";
      const feeAmount = typeof context.feeAmount === "number" ? context.feeAmount : 0;
      const displayCurrency = currency || "USD";
      const formattedAmount = Number.isFinite(amount) ? amount.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "0.00";
      const formattedFee = Number.isFinite(feeAmount) ? feeAmount.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "0.00";
      const totalAmount = Number.isFinite(amount) && Number.isFinite(feeAmount) ? amount + feeAmount : amount;
      const formattedTotal = Number.isFinite(totalAmount) ? totalAmount.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : formattedAmount;

      const sealedCtx = sealTransferContext({
        toFullName: toFullName,
        toAccountNumber: toAccountNumber,
        toEmail: toEmail,
        amount: amount,
        currency: displayCurrency,
        feeAmount: feeAmount
      });

      const Swal = window.Swal;
      return await new Promise((resolve) => {
        let transferPin = "";
        let otpSent = false;
        let sentMaskedEmail = null;
        let delegated = false;
        let phase = "pin"; // pin -> otp -> confirm
        let confirmedOtp = "";

        const renderPinOtpBody = (opts = {}) => {
          const sending = Boolean(opts.sending);
          const sendError = opts.sendError ? String(opts.sendError) : "";
          const otpValue = opts.otpValue ? String(opts.otpValue) : "";
          return `
            <div class="vt-pin-otp-wrap" style="max-width:420px; margin: 0 auto;">
              <div style="text-align:center; margin-bottom:18px; color:#475569; font-size:14px; line-height:1.6;">
                Enter your <strong>Transfer PIN</strong> (Transaction Code) below and tap
                <strong>Send Verification Code</strong>.
              </div>
              <div style="margin-bottom: 14px;">
                <label for="vt-pin-input">Transfer PIN</label>
                <input id="vt-pin-input" type="password" value="${transferPin ? escapeHtml(transferPin) : ""}" class="swal2-input" ${otpSent ? " readonly disabled" : ""} />
              </div>
              ${!otpSent ? "" : `
                <div style="margin: 14px 0 10px; padding: 12px; background:#ecfdf5; color:#065f46;">
                  Code sent to: <strong>${escapeHtml(sentMaskedEmail || "your email")}</strong>
                </div>
                <div>
                  <label for="vt-otp-input">6-Digit OTP</label>
                  <input id="vt-otp-input" type="text" maxlength="6" value="${escapeHtml(otpValue)}" class="swal2-input" />
                </div>
              `}
              ${sendError ? `<div style="color:red;">${escapeHtml(sendError)}</div>` : ""}
            </div>
          `;
        };

        const renderConfirmBody = (opts = {}) => {
          report("[RENDER] renderConfirmBody called");
          const integrityErr = opts.integrityError ? String(opts.integrityError) : "";
          return `
            <div class="vt-confirm-transfer-wrap" style="max-width:460px; margin: 0 auto;">
              <div style="margin-bottom:18px; padding:14px 16px; background:#eff6ff; border:1px solid #bfdbfe; border-radius:12px; color:#1e40af; font-size:13px; line-height:1.6;">
                <div style="display:flex; align-items:center; gap:10px; margin-bottom:4px;">
                  <span style="font-weight:800; font-size:14px;">Transfer review required</span>
                </div>
                <div style="margin-left:28px;">OTP verified successfully. Please carefully review the transfer details below and click <strong>Confirm Transfer</strong> to finalize the disbursement.</div>
              </div>
              <div style="margin-bottom:10px;">
                <label>Recipient:</label>
                <input type="text" id="vt-confirm-fullname" data-field="toFullName" value="${escapeHtml(toFullName)}" readonly class="swal2-input" />
              </div>
              <div style="margin-bottom:10px;">
                <label>Account Number:</label>
                <input type="text" id="vt-confirm-acctnum" data-field="toAccountNumber" value="${escapeHtml(toAccountNumber)}" readonly class="swal2-input" />
              </div>
              <div style="margin-bottom:10px;">
                <label>Amount:</label>
                <input type="text" id="vt-confirm-amount" data-field="amount" value="${escapeHtml(formattedAmount)}" readonly class="swal2-input" />
              </div>
              ${integrityErr ? `<div style="color:red;">${escapeHtml(integrityErr)}</div>` : ""}
            </div>
          `;
        };

        const bindDelegatedHandlers = (popupEl) => {
          report("[BIND] bindDelegatedHandlers called (delegated=" + delegated + ", hasPopup=" + Boolean(popupEl) + ")");
          if (delegated || !popupEl) {
            report("[BIND] Early return (delegated was " + delegated + ")");
            return;
          }
          delegated = true;
          popupEl.addEventListener("click", (ev) => {
            const confirmBtn = ev.target.closest && ev.target.closest(".swal2-confirm");
            const cancelBtn = ev.target.closest && ev.target.closest(".swal2-cancel");
            const resendBtn = ev.target.closest && ev.target.closest("#vt-resend-btn");
            report("[CLICK] confirmBtn=" + Boolean(confirmBtn) + ", cancelBtn=" + Boolean(cancelBtn) + ", phase=" + phase);
            if (resendBtn) {
              ev.preventDefault();
              ev.stopPropagation();
              (async () => { try { await onSendOtp(); } catch (_) {} })();
              return;
            }
            if (confirmBtn) {
              ev.preventDefault();
              ev.stopPropagation();
              (async () => {
                if (phase === "pin") {
                  if (!otpSent) await onSendOtp();
                } else if (phase === "otp") {
                  await onAuthorize();
                } else if (phase === "confirm") {
                  await onConfirmFinal();
                }
              })();
              return;
            }
            if (cancelBtn) {
              ev.preventDefault();
              ev.stopPropagation();
              (async () => {
                if (phase === "confirm") {
                  phase = "otp";
                  openConfirmOrPinOtp({ focus: "vt-otp-input" });
                  return;
                }
                try { Swal.close(); } catch (_) {}
                resolve(null);
              })();
              return;
            }
          });
          popupEl.addEventListener("keydown", (ev) => {
            if (ev.key === "Enter") {
              ev.preventDefault();
              (async () => {
                if (phase === "pin") {
                  if (!otpSent) await onSendOtp();
                } else if (phase === "otp") {
                  await onAuthorize();
                } else if (phase === "confirm") {
                  await onConfirmFinal();
                }
              })();
            }
          });
        };

        const openConfirmOrPinOtp = (extraOpts = {}) => {
          report("[OPEN] openConfirmOrPinOtp phase=" + phase);
          if (phase === "confirm") {
            report("[OPEN] In CONFIRM branch: rendering Confirm Transfer section");
            const integrityErr = extraOpts.integrityError ? extraOpts.integrityError : "";
            const confirmHtml = renderConfirmBody({ integrityError: integrityErr });
            if (Swal.isVisible()) {
              report("[CONFIRM] Updating existing Swal in-place via Swal.update");
              Swal.update({
                title: "Confirm Transfer",
                html: confirmHtml,
                showCancelButton: true,
                confirmButtonText: "Confirm Transfer",
                cancelButtonText: "← Back to OTP",
                showConfirmButton: true,
                showCloseButton: true,
                focusConfirm: true,
                allowOutsideClick: false,
                allowEscapeKey: false,
                buttonsStyling: true,
                confirmButtonColor: "#059669",
                cancelButtonColor: "#475569"
              });
              const cb = document.querySelector(".swal2-confirm");
              if (cb && typeof cb.focus === "function") setTimeout(() => cb.focus(), 60);
              return;
            }
            Swal.fire({
              title: "Confirm Transfer",
              html: confirmHtml,
              showCancelButton: true,
              confirmButtonText: "Confirm Transfer",
              cancelButtonText: "← Back to OTP",
              showConfirmButton: true,
              showCloseButton: true,
              focusConfirm: true,
              allowOutsideClick: false,
              allowEscapeKey: false,
              buttonsStyling: true,
              confirmButtonColor: "#059669",
              cancelButtonColor: "#475569",
              didOpen: (popupEl) => {
                report("[CONFIRM] didOpen fired! Title in popup: " + (popupEl.querySelector(".swal2-title")?.textContent));
                bindDelegatedHandlers(popupEl);
              },
              willClose: () => {
                report("[CONFIRM] willClose fired! Resetting delegated to false");
                delegated = false;
              },
              preConfirm: () => { return false; }
            });
            return;
          }

          const sendError = extraOpts.sendError ? extraOpts.sendError : "";
          const otpValue = extraOpts.otpValue ? extraOpts.otpValue : "";
          const focus = extraOpts.focus || (otpSent ? "vt-otp-input" : "vt-pin-input");
          const pinOtpHtml = renderPinOtpBody({ sending: false, sendError, otpValue });

          if (Swal.isVisible()) {
            report("[PIN/OTP] Updating existing Swal in-place via Swal.update (phase=" + phase + ")");
            Swal.update({
              title: otpSent ? "Authorize Transfer" : "Initiate Transfer Authorization",
              html: pinOtpHtml,
              showCancelButton: true,
              confirmButtonText: otpSent ? "Authorize Transfer" : "Send Verification Code",
              cancelButtonText: "Cancel",
              showConfirmButton: true,
              showCloseButton: true,
              confirmButtonColor: "#0f172a",
              cancelButtonColor: "#475569"
            });
            try {
              const f = document.querySelector("#" + focus);
              if (f && typeof f.focus === "function") setTimeout(() => f.focus(), 50);
            } catch (_) {}
            return;
          }

          report("[OPEN] Calling Swal.fire for pin/otp (phase=" + phase + ")");
          Swal.fire({
            title: otpSent ? "Authorize Transfer" : "Initiate Transfer Authorization",
            html: pinOtpHtml,
            showCancelButton: true,
            confirmButtonText: otpSent ? "Authorize Transfer" : "Send Verification Code",
            cancelButtonText: "Cancel",
            showConfirmButton: true,
            showCloseButton: true,
            focusConfirm: false,
            allowOutsideClick: false,
            allowEscapeKey: false,
            buttonsStyling: true,
            confirmButtonColor: "#0f172a",
            didOpen: (popupEl) => {
              report("[PIN/OTP] didOpen fired! (phase=" + phase + ", title=" + (popupEl.querySelector(".swal2-title")?.textContent) + ")");
              bindDelegatedHandlers(popupEl);
              try {
                const f = popupEl.querySelector("#" + focus);
                if (f && typeof f.focus === "function") setTimeout(() => f.focus(), 50);
              } catch (_) {}
            },
            willClose: () => {
              report("[PIN/OTP] willClose fired! (phase=" + phase + ", delegated was=" + delegated + ")");
              delegated = false;
            },
            preConfirm: () => { return false; }
          });
        };

        const showSending = () => {
          const popupEl = Swal.getPopup();
          if (!popupEl) return;
          bindDelegatedHandlers(popupEl);
          const pinInput = popupEl.querySelector("#vt-pin-input");
          const pinVal = pinInput ? String(pinInput.value || "").trim() : transferPin;
          if (pinVal) transferPin = pinVal;
          Swal.update({
            html: renderPinOtpBody({ sending: true }),
            title: "Sending Verification Code...",
            confirmButtonText: "Please wait...",
            showCloseButton: false,
            allowOutsideClick: false
          });
          Swal.showLoading();
        };

        const onSendOtp = async () => {
          report("[STEP] onSendOtp starting");
          const popupEl = Swal.getPopup();
          if (popupEl) {
            const pinInput = popupEl.querySelector("#vt-pin-input");
            transferPin = pinInput ? String(pinInput.value || "").trim() : "";
          }
          if (!transferPin || transferPin.length < 6) {
            Swal.hideLoading();
            openConfirmOrPinOtp({ sendError: "Transfer PIN must be at least 6 characters or digits." });
            return;
          }
          showSending();
          try {
            const resp = await fetch("/api/customer/transfer/request-otp", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ transferPin: transferPin })
            });
            const body = await resp.json();
            otpSent = true;
            phase = "otp";
            sentMaskedEmail = body.maskedEmail;
            Swal.hideLoading();
            report("[STEP] OTP email sent! Opening OTP phase dialog");
            openConfirmOrPinOtp();
          } catch (err) {
            report("[STEP] onSendOtp error: " + err);
          }
        };

        const onAuthorize = async () => {
          report("[STEP] onAuthorize starting");
          const popupEl = Swal.getPopup();
          let otpVal = "";
          if (popupEl) {
            const otpInput = popupEl.querySelector("#vt-otp-input");
            otpVal = otpInput ? String(otpInput.value || "").trim() : "";
          }
          report("[STEP] onAuthorize read otpVal: '" + otpVal + "'");
          if (!/^\d{6}$/.test(otpVal)) {
            report("[STEP] onAuthorize invalid OTP regex!");
            openConfirmOrPinOtp({ otpValue: otpVal, sendError: "Please enter the 6 numeric digits of the email verification code." });
            return;
          }
          confirmedOtp = otpVal;
          phase = "confirm";
          report("[STEP] Valid OTP confirmed! Setting phase='confirm' and calling openConfirmOrPinOtp()");
          openConfirmOrPinOtp();
        };

        const onConfirmFinal = async () => {
          report("[STEP] onConfirmFinal clicked! Transfer confirmed!");
          Swal.close();
          resolve({ transferPin, otp: confirmedOtp });
        };

        phase = "pin";
        openConfirmOrPinOtp();
      });
    };

    // Automated runner
    async function runTest() {
      const wait = (ms) => new Promise(r => setTimeout(r, ms));
      report("=== Starting Automated Test ===");
      showCombinedPinAndOtpDialog({
        toAccountNumber: "9876543210",
        amount: 2500,
        currency: "USD",
        toFullName: "Sarah Connor"
      }).then(res => {
        report("[RESULT] showCombinedPinAndOtpDialog resolved with: " + JSON.stringify(res));
      });

      await wait(300);
      report("--- Step 1: Entering PIN '123456' ---");
      const pinInput = document.querySelector("#vt-pin-input");
      if (!pinInput) {
        report("FAIL: #vt-pin-input not found!");
        return;
      }
      pinInput.value = "123456";
      const confirmBtn1 = document.querySelector(".swal2-confirm");
      report("Clicking 'Send Verification Code' button...");
      confirmBtn1.click();

      await wait(600);
      report("--- Step 2: Waiting for OTP input ---");
      const otpInput = document.querySelector("#vt-otp-input");
      if (!otpInput) {
        report("FAIL: #vt-otp-input not found! popup=" + document.querySelector(".swal2-popup")?.outerHTML.slice(0, 200));
        return;
      }
      report("Found #vt-otp-input! Entering '654321'...");
      otpInput.value = "654321";

      const confirmBtn2 = document.querySelector(".swal2-confirm");
      report("Confirm button text: '" + confirmBtn2?.textContent + "'");
      report("Clicking 'Authorize Transfer' button...");
      confirmBtn2.click();

      await wait(600);
      report("--- Step 3: Checking for 'Confirm Transfer' section ---");
      const popup = document.querySelector(".swal2-popup");
      const isVisible = Swal.isVisible();
      const confirmWrap = document.querySelector(".vt-confirm-transfer-wrap");
      const title = document.querySelector(".swal2-title")?.textContent;
      const confirmBtn3 = document.querySelector(".swal2-confirm");

      report("Swal.isVisible(): " + isVisible);
      report("Popup element exists: " + Boolean(popup));
      report("Popup display style: " + popup?.style.display);
      report("Popup classList: " + popup?.className);
      report(".vt-confirm-transfer-wrap exists: " + Boolean(confirmWrap));
      report("Current Swal title: '" + title + "'");
      report("Current confirm button text: '" + confirmBtn3?.textContent + "'");

      if (confirmWrap && isVisible) {
        report(">>> TEST SUCCESS: Confirm Transfer section IS DISPLAYED! <<<");
      } else {
        report(">>> TEST FAILURE: Confirm Transfer section FAILED TO DISPLAY! <<<");
      }
      report("=== Automated Test Finished ===");
    }
    window.runTest = runTest;
  </script>
</body>
</html>
